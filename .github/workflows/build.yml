name: Build Windows Portable

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    name: Build Windows (x64)
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Build Windows x64 app
        run: npm run build:win -- --x64
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        
      - name: Show build artifacts size
        run: |
          echo "=========================================="
          echo "Build completed! Checking sizes..."
          echo "=========================================="
          echo "=== dist/ size ==="
          du -sh dist/* 2>/dev/null | sort -hr || echo "dist/ not found"
          echo ""
          echo "=== release/ size ==="
          if [ -d "release" ]; then
            du -sh release/* 2>/dev/null | sort -hr
            echo ""
            echo "=== .zip file size ==="
            find release -name "*.zip" -exec du -sh {} \; 2>/dev/null | sort -hr
          else
            echo "release/ not found"
          fi
        shell: bash
      
      - name: Show build output path
        run: |
          echo "=========================================="
          echo "Build completed!"
          echo "Output path: release/"
          echo "=========================================="
        shell: bash

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: windows-portable-x64
          path: release/**/*.zip
          retention-days: 30
          if-no-files-found: ignore
