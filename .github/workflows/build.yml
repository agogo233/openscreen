name: Build Windows Portable

on:
  workflow_dispatch:
    inputs:
      arch:
        description: 'Architecture to build'
        required: true
        default: 'x64'
        type: choice
        options:
          - x64
          - arm64

jobs:
  build-windows:
    runs-on: windows-latest
    strategy:
      matrix:
        arch: ${{ fromJSON(format('["{0}"]', github.event.inputs.arch)) }}
    
    name: Build Windows (${{ matrix.arch }})
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Build Windows app
        run: npm run build:win -- --${{ matrix.arch }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        
      - name: Show build output path
        run: |
          echo "=========================================="
          echo "Build completed!"
          echo "Output path: release/${{ github.event.inputs.arch }}/windows-portable/"
          echo "=========================================="
        shell: bash

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: windows-portable-${{ matrix.arch }}
          path: release/**/*.zip
          retention-days: 30
